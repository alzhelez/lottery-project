name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Движок (pytest, ${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - name: Зависимости
        run: python -m pip install -r python/requirements-dev.txt
      - name: Тесты
        run: python -m pytest tests/pytest --alluredir=allure-results/python --junitxml=test-results/engine.xml
      - name: Причины падений
        if: failure()
        run: python tools/ci_annotate.py test-results/engine.xml
      - name: Результаты для Allure
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: allure-python
          path: allure-results/python
          retention-days: 14

  e2e:
    name: Интерфейс (Playwright на моке API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: |
          python -m pip install -r python/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Проверка типов и сборка
        run: |
          npm run typecheck
          npm run build
      - name: Сквозные тесты
        env:
          PYTHON_BIN: python
        run: npm run test:e2e
      - name: Результаты для Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results/e2e
          retention-days: 14
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  api:
    name: API-автотесты (Python, Go, Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tests/api/go/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Зависимости и сборка
        run: |
          python -m pip install -r python/requirements-dev.txt
          npm ci
          npm run build
      - name: Тестовое окружение (мок API + приложение)
        env:
          PYTHON_BIN: python
        run: python tests/api/env.py start
      - name: Python
        run: python -m pytest tests/api/python --alluredir=allure-results/api-python --junitxml=test-results/api-python.xml
      - name: Go
        if: always()
        run: npm run test:api:go
      - name: Java
        if: always()
        run: |
          mkdir -p test-results
          mvn -B -f tests/api/java/pom.xml test 2>&1 | tee test-results/java.log
      - name: Причины падений
        if: failure()
        run: |
          python tools/ci_annotate.py test-results/api-python.xml allure-results/api-go/junit.xml "tests/api/java/target/surefire-reports/*.xml"
          grep -E '^\[ERROR\]' test-results/java.log 2>/dev/null | head -n 20 | sed 's/%/%25/g; s/^/::error title=Maven::/' || true
      - name: Остановка окружения и журналы
        if: always()
        run: |
          python tests/api/env.py stop
          tail -n 50 tests/api/app.log tests/api/mock.log || true
      - name: Результаты для Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api
          path: |
            allure-results/api-python
            allure-results/api-go
            allure-results/api-java
          retention-days: 14

  report:
    name: Allure-отчёт
    needs: [engine, e2e, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
      - name: Сборка отчёта
        run: |
          mkdir -p allure-results/allure-python allure-results/allure-e2e
          dirs="allure-results/allure-python allure-results/allure-e2e"
          for d in api-python api-go api-java; do
            [ -d "allure-results/allure-api/$d" ] && dirs="$dirs allure-results/allure-api/$d"
          done
          npx allure generate $dirs
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
      - name: Подготовка для GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  pages:
    name: Публикация отчёта на GitHub Pages
    needs: report
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.ALLURE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
